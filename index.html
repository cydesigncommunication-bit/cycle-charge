<style>
:root{

  --violet:#8C79E8; --violet-ink:#3B2C79; --violet-bg:#CFC2FF;
  --orange:#F6A93B; --orange-bg:#FFC978; --orange-ink:#6A3F00;
  --blue:#7FB6EE; --blue-bg:#BBDDFB; --blue-ink:#123C63;

  --mint:#4FB79A; --mint-bg:#B7E8D8; --mint-ink:#0C4436;
  --ink-pill:#141021; --on-pill:#FFFFFF; --tag-bg:rgba(255,255,255,.62);

}

    --bg:#131020; --blob1:#4A2340; --blob2:#4A3520; --blob3:#1E3450; --blob4:#332358;
    --ink:#F1ECFA; --ink-2:#B3A9C9; --ink-3:#847AA0;
    --glass:rgba(38,31,58,.58); --glass-strong:rgba(44,36,66,.86); --glass-line:rgba(255,255,255,.12);
    --shadow:0 10px 34px -14px rgba(0,0,0,.7);
    --violet:#A794FF; --violet-ink:#EDE7FF; --violet-bg:#4B3C8F;
    --orange:#F0A93F; --orange-bg:#7A5316; --orange-ink:#FFE6C2;
    --blue:#8FC1F2; --blue-bg:#274764; --blue-ink:#D6EBFF;
    --pink:#F29CCC; --pink-bg:#68264C; --pink-ink:#FFE0F1;
    --mint:#6FCDB2; --mint-bg:#1C4C40; --mint-ink:#D3F5E9;
    --ink-pill:#F1ECFA; --on-pill:#171326; --tag-bg:rgba(255,255,255,.17);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131020; --blob1:#4A2340; --blob2:#4A3520; --blob3:#1E3450; --blob4:#332358;
  --ink:#F1ECFA; --ink-2:#B3A9C9; --ink-3:#847AA0;
  --glass:rgba(38,31,58,.58); --glass-strong:rgba(44,36,66,.86); --glass-line:rgba(255,255,255,.12);
  --shadow:0 10px 34px -14px rgba(0,0,0,.7);
  --violet:#A794FF; --violet-ink:#EDE7FF; --violet-bg:#4B3C8F;

  --blue:#8FC1F2; --blue-bg:#274764; --blue-ink:#D6EBFF;

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
#blobs{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none}
#blobs i{position:absolute; display:block; border-radius:50%; filter:blur(60px); opacity:.85}
#blobs i:nth-child(1){width:56vw;height:56vw;background:var(--blob1);top:-14vw;right:-16vw}
#blobs i:nth-child(2){width:48vw;height:48vw;background:var(--blob2);top:32vh;left:-20vw}
#blobs i:nth-child(3){width:52vw;height:52vw;background:var(--blob3);bottom:-16vw;right:-12vw}
#blobs i:nth-child(4){width:40vw;height:40vw;background:var(--blob4);top:58vh;left:34vw}

h1,h2,h3,h4{font-family:"Outfit", ui-sans-serif, system-ui, sans-serif; margin:0; letter-spacing:-.032em; line-height:1.1; text-wrap:balance}
h1{font-size:clamp(1.75rem,6vw,2.3rem); font-weight:800}
h2{font-size:1.35rem; font-weight:700}
h3{font-size:1.05rem; font-weight:700}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
:focus-visible{outline:2.5px solid var(--violet); outline-offset:2px; border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.mono{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3); font-weight:500}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}

/* ---------- shell ---------- */
.shell{max-width:560px; margin:0 auto; padding:18px 16px 130px}
.view{display:none}
.view.active{display:block; animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.between{display:flex; gap:12px; align-items:center; justify-content:space-between}

/* ---------- glass ---------- */
.glass{
  background:var(--glass); backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-line); border-radius:26px; box-shadow:var(--shadow);
}
.pad{padding:18px}
.pad-s{padding:14px}

/* ---------- topbar ---------- */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:18px}
.avatar{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:linear-gradient(140deg,var(--violet),var(--pink)); color:#fff; font-family:"Outfit",sans-serif; font-weight:700; font-size:1.1rem; box-shadow:var(--shadow)}
.topbar h2{font-size:1.15rem}
.icon-btn{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow); color:var(--ink)}
.icon-btn:hover{transform:translateY(-1px)}

/* ---------- hero ---------- */
.hero{border-radius:28px; padding:20px; position:relative; overflow:hidden; box-shadow:var(--shadow)}
.hero h2{font-size:1.7rem; line-height:1.05; max-width:62%}
.hero .art{position:absolute; right:-6px; bottom:-6px; width:132px; opacity:.9}
.hero .art svg{width:100%; height:auto}

/* ---------- day strip ---------- */
.daystrip{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:none; width:44px; padding:9px 0 8px; border-radius:18px; text-align:center;
  background:var(--glass); border:1px solid var(--glass-line); transition:transform .15s}
.day .d{font-size:.68rem; color:var(--ink-3); text-transform:capitalize; font-weight:600}
.day .n{font-family:"Outfit",sans-serif; font-weight:700; font-size:1.05rem; margin-top:1px}
.day .dot{width:6px; height:6px; border-radius:50%; margin:4px auto 0; background:var(--ink-3); opacity:.45}
.day[aria-pressed="true"]{background:var(--ink-pill); border-color:var(--ink-pill); color:var(--on-pill); transform:translateY(-2px)}
.day[aria-pressed="true"] .d{color:var(--on-pill); opacity:.7}
.day.today .n{text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px}

/* ---------- colored cards ---------- */
.ccard{border-radius:24px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; text-align:left}
.ccard.violet{background:var(--violet-bg); color:var(--violet-ink)}
.ccard.orange{background:var(--orange-bg); color:var(--orange-ink)}
.ccard.blue{background:var(--blue-bg); color:var(--blue-ink)}
.ccard.pink{background:var(--pink-bg); color:var(--pink-ink)}
.ccard.mint{background:var(--mint-bg); color:var(--mint-ink)}
.tag{align-self:flex-start; background:var(--tag-bg); border-radius:999px; padding:3px 11px; font-size:.72rem; font-weight:700}

/* ---------- chips ---------- */
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:700; padding:5px 11px; border-radius:999px;
  background:var(--glass-strong); border:1px solid var(--glass-line); color:var(--ink-2)}
.chip .sq{width:8px; height:8px; border-radius:50%; background:currentColor}
.chip.p-menstruelle{color:var(--pink)} .chip.p-folliculaire{color:var(--mint)}
.chip.p-ovulatoire{color:var(--orange)} .chip.p-luteale{color:var(--violet)}

/* ---------- buttons ---------- */
.btn{border-radius:999px; padding:11px 20px; font-family:"Outfit",sans-serif; font-weight:700; font-size:.92rem;
  background:var(--glass-strong); border:1px solid var(--glass-line); box-shadow:var(--shadow); color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn.dark{background:var(--ink-pill); color:var(--on-pill); border-color:transparent}
.btn.sm{padding:7px 14px; font-size:.82rem}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none; color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn.block{width:100%; text-align:center}

/* ---------- forms ---------- */
input,select,textarea{
  font:inherit; color:var(--ink); background:var(--glass-strong); border:1px solid var(--glass-line);
  border-radius:14px; padding:10px 13px; width:100%;
}
input[type=number],input[type=date]{font-family:"IBM Plex Mono",monospace}
label.field{display:flex; flex-direction:column; gap:5px; font-size:.78rem; color:var(--ink-2); font-weight:600}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:11px}
.tile{border-radius:20px; padding:14px 15px; display:flex; flex-direction:column; gap:3px; align-items:flex-start}
.tile .val{font-family:"Outfit",sans-serif; font-weight:800; font-size:1.6rem; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.05}
.tile .val span{font-size:.8rem; font-weight:600; color:var(--ink-2); letter-spacing:0}

/* ---------- exercise pictogram ---------- */
.pic{background:var(--glass-strong); border:1px solid var(--glass-line); border-radius:18px; display:grid; place-items:center; color:var(--ink); overflow:hidden}
.pic svg{width:100%; height:100%; display:block; padding:6px}
.pic.sm{width:62px; height:52px; flex:none}
.pic.lg{width:100%; aspect-ratio:6/5; border-radius:22px}
.pic.xs{width:46px; height:40px; flex:none; border-radius:14px}

/* ---------- exercise rows ---------- */
.exrow{display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--glass-line)}
.exrow:first-of-type{border-top:0}
.exrow .body{flex:1; min-width:0}
.exname{font-family:"Outfit",sans-serif; font-weight:700; font-size:.95rem; text-align:left; line-height:1.2}
.exname:hover{color:var(--violet)}
.presc{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-2); text-align:right; white-space:nowrap; line-height:1.35}

/* ---------- filters ---------- */
.filterbar{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0}
.filterbar::-webkit-scrollbar{display:none}
.fbtn{flex:none; border-radius:999px; padding:7px 14px; font-size:.82rem; font-weight:600;
  background:var(--glass); border:1px solid var(--glass-line); color:var(--ink-2)}
.fbtn[aria-pressed="true"]{background:var(--ink-pill); border-color:var(--ink-pill); color:var(--on-pill)}

/* ---------- exercise grid ---------- */
.exgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.excard{border-radius:22px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:8px}
.excard .pic{aspect-ratio:5/4; width:100%}
.excard h3{font-size:.88rem; line-height:1.2}

/* ---------- calendar ---------- */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .h{text-align:center; font-size:.64rem; color:var(--ink-3); font-weight:700; text-transform:uppercase; padding-bottom:2px}
.cell{aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:var(--glass); border:1px solid transparent; font-size:.8rem; font-weight:600; position:relative}
.cell.out{opacity:.32}
.cell .pd{width:7px; height:7px; border-radius:50%}
.cell.today{border-color:var(--ink-pill)}
.cell[aria-pressed="true"]{background:var(--ink-pill); color:var(--on-pill)}
.cell .mark{position:absolute; top:3px; right:4px; font-size:.55rem}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:.72rem; color:var(--ink-2)}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:-1px}

/* ---------- energy picker ---------- */
.energy{display:flex; gap:7px}
.energy button{flex:1; padding:9px 0; border-radius:14px; background:var(--glass); border:1px solid var(--glass-line); font-weight:700; font-size:.85rem}
.energy button[aria-pressed="true"]{background:var(--violet); color:#fff; border-color:transparent}

/* ---------- sets ---------- */
.setline{display:grid; grid-template-columns:22px 1fr 1fr 38px; gap:7px; align-items:center; margin-bottom:7px}
.setline .n{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-3)}
.setline input{padding:9px 10px; border-radius:12px; text-align:center}
.setline .x{border-radius:12px; padding:8px 0; color:var(--ink-3); font-size:.9rem}

/* ---------- bottom nav ---------- */
.nav{position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:50;
  display:flex; gap:2px; padding:7px; border-radius:999px; background:var(--ink-pill); box-shadow:0 12px 32px -10px rgba(20,10,40,.5)}
.nav button{width:54px; height:48px; border-radius:999px; display:grid; place-items:center; color:var(--on-pill); opacity:.5}
.nav button[aria-selected="true"]{background:var(--bg); color:var(--ink); opacity:1}
.nav svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(23,19,38,.42); backdrop-filter:blur(6px); z-index:60;
  display:flex; align-items:flex-end; justify-content:center; overflow-y:auto; padding:20px 12px}
.overlay[hidden]{display:none!important}
.modal{background:var(--glass-strong); backdrop-filter:blur(26px) saturate(160%); border:1px solid var(--glass-line);
  border-radius:28px; max-width:520px; width:100%; box-shadow:var(--shadow); margin:auto 0}
.modal-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:18px 20px 10px}
.modal-body{padding:0 20px 22px}
@media (min-width:600px){.overlay{align-items:center}}

/* ---------- misc ---------- */
ul.clean{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:5px}
ul.clean li::marker{color:var(--ink-3)}
ol.clean{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:5px}
.restbtn{margin-top:6px; font-size:.74rem; font-weight:700; padding:5px 11px; border-radius:999px; background:var(--mint-bg); color:var(--mint-ink)}
.resttimer{position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:70; width:min(92vw,420px);
  display:flex; align-items:center; gap:10px; padding:10px 12px 10px 16px; border-radius:999px; overflow:hidden;
  background:var(--mint-bg); color:var(--mint-ink); box-shadow:var(--shadow); font-family:"Outfit",sans-serif}
.resttimer[hidden]{display:none!important}
.rt-bar{position:absolute; inset:0; z-index:-1}
.rt-bar i{display:block; height:100%; background:var(--mint); opacity:.35; transition:width .25s linear}
.rt-label{font-weight:600; font-size:.86rem}
.rt-time{font-size:1.25rem; font-weight:700; flex:1}
.resttimer button{width:32px; height:32px; border-radius:50%; background:var(--mint-ink); color:var(--mint-bg); font-size:.8rem}
.vidwrap{display:flex; flex-direction:column; gap:7px; margin-bottom:14px}
.vidlink{display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:18px; text-decoration:none;
  background:var(--pink-bg); color:var(--pink-ink); box-shadow:var(--shadow)}
.vidlink:hover{transform:translateY(-1px)}
.vid-ico{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:none; background:var(--pink-ink); color:var(--pink-bg)}
.vid-txt{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; font-family:"Outfit",sans-serif}
.vid-txt .tiny{font-family:"Plus Jakarta Sans",sans-serif; opacity:.85}
.vid-go{font-weight:700; opacity:.7}
.vidalt{align-self:flex-end; text-decoration:underline; text-underline-offset:3px}
.callout{border-radius:18px; padding:13px 15px; background:var(--glass-strong); border:1px solid var(--glass-line); font-size:.87rem}
.bar{height:9px; background:var(--glass-strong); border-radius:999px; overflow:hidden; border:1px solid var(--glass-line)}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--violet),var(--pink))}
.empty{text-align:center; padding:28px 18px; color:var(--ink-2); border:1.5px dashed var(--glass-line); border-radius:22px; font-size:.9rem}
.toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink-pill); color:var(--on-pill);
  padding:11px 20px; border-radius:999px; font-size:.86rem; font-weight:600; z-index:80; box-shadow:var(--shadow)}
.toast[hidden]{display:none!important}
svg.spark{display:block; width:100%; height:110px; overflow:visible}
.divider{height:1px; background:var(--glass-line); border:0; margin:2px 0}
.tablewrap{overflow-x:auto; border-radius:16px}
table{border-collapse:collapse; width:100%; font-size:.83rem}
td{padding:7px 9px; border-bottom:1px solid var(--glass-line); white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--ink-2)}

/* motivation */
.motiv{display:flex; flex-direction:column; gap:12px}
.mv-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mv-stats > div{display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:16px; background:var(--glass-strong); border:1px solid var(--glass-line)}
.mv-big{font-family:"Outfit",sans-serif; font-weight:700; font-size:1.5rem; line-height:1}
.mv-big small{font-size:.8rem; opacity:.6; margin-left:2px}
.mv-badges{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 4px; border-radius:999px; font-size:.72rem; font-weight:600; background:var(--orange-bg); color:var(--orange-ink)}
.badge b{display:grid; place-items:center; min-width:24px; height:24px; padding:0 4px; border-radius:999px; background:var(--orange); color:#fff; font-size:.7rem}
.mv-quote{font-style:italic; font-size:.86rem; opacity:.8; text-align:center; margin:2px 0 0}
.cel{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px}
.cel-num{font-family:"Outfit",sans-serif; font-weight:800; font-size:3.4rem; line-height:1; background:linear-gradient(90deg,var(--violet),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.cel-num small{display:block; font-size:.8rem; font-weight:600; -webkit-text-fill-color:var(--ink-2); color:var(--ink-2); letter-spacing:.06em; text-transform:uppercase}
.cel-badge{padding:8px 14px; border-radius:999px; background:var(--orange-bg); color:var(--orange-ink); font-size:.86rem; animation:pop .7s .2s both cubic-bezier(.2,1.6,.4,1)}
.cel-dots{display:flex; gap:8px; margin-top:6px}
.cel-dots i{width:14px; height:14px; border-radius:50%; background:var(--glass-strong); border:1px solid var(--glass-line)}
.cel-dots i.on{background:var(--mint); border-color:var(--mint)}
.confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:inherit}
.confetti span{position:absolute; top:-12px; width:8px; height:12px; border-radius:2px; animation:fall 2s ease-in forwards; opacity:0}
.modal{position:relative}
@keyframes fall{0%{opacity:1; top:-12px} 100%{opacity:0; top:100%; margin-left:20px}}
@keyframes pop{0%{transform:scale(.4); opacity:0} 100%{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion:reduce){.confetti{display:none} .cel-num,.cel-badge{animation:none}}
</style>

<script>
const EXERCISES = [
/* ============ FESSIERS ============ */
{id:"hip-thrust-barre",n:"Hip thrust à la barre",g:"Fessiers",m:"Barre",mus:"Grand fessier, ischios",lvl:"Intermédiaire",

 e:["Assise au sol, dos contre le banc, barre sur le pli des hanches, pieds écartés largeur de bassin, orteils légèrement ouverts.","Menton rentré, côtes basses : pousse dans les talons et monte les hanches jusqu'à ce que le corps forme une ligne épaules-hanches-genoux.","Serre les fessiers 1 seconde en haut, puis redescends en contrôle sans poser la barre au sol entre les reps."],

{id:"kickback-poulie",n:"Kickback fessier à la poulie basse",g:"Fessiers",m:"Poulie",mus:"Grand fessier",lvl:"Débutante",

 e:["Buste légèrement penché en avant, dos neutre, jambe d'appui légèrement fléchie.","Envoie la jambe vers l'arrière en gardant le genou peu fléchi, jusqu'à l'extension de hanche complète.","Serre 1 s, reviens lentement sans reposer la charge."],

/* ===================== moteur de cycle ===================== */
function starts(){ return (S.cycle.historique||[]).slice().sort(); }
function avgLen(){
  const h = starts();
  if(h.length>=2){
    const d=[];
    for(let i=1;i<h.length;i++){ const x=daysBetween(h[i-1],h[i]); if(x>=18&&x<=45) d.push(x); }
    if(d.length) return Math.round(d.reduce((a,b)=>a+b,0)/d.length);
  }
  return Math.max(21, Math.min(40, +S.cycle.duree||28));
}
function finRegles(){ return Math.max(2, Math.min(8, +S.cycle.regles||5)); }
/* garde une vraie phase folliculaire, même sur un cycle court */
function ovDay(len){ return Math.max(finRegles()+4, len-14); }
/* Plages de jours de chaque phase, calculées sur TON cycle (et pas sur un cycle théorique de 28 j). */
function phaseRange(id, len){
  const fin = finRegles(), ov = ovDay(len);
  const r = {menstruelle:[1,fin], folliculaire:[fin+1,ov-2], ovulatoire:[ov-1,ov+1], luteale:[ov+2,len]}[id];
  return r ? `Jours ${r[0]} à ${r[1]}` : "";
}
function phaseFor(jour, len){
  const fin = finRegles();
  const ov = ovDay(len);
  if(jour<=fin) return PHASES[0];
  if(jour < ov-1) return PHASES[1];
  if(jour <= ov+1) return PHASES[2];
  return PHASES[3];
}
function cycleInfo(date){
  const h = starts(); if(!h.length) return null;
  const d = date || todayISO();
  const len = avgLen();
  let base = null;
  for(const s of h){ if(s<=d) base = s; }
  let jour, retard=false;
  if(base){
    jour = daysBetween(base,d)+1;
    if(d > todayISO() && jour > len){
      /* jour futur : on projette les cycles suivants (prochaines règles prévues, ou dès demain si elles sont en retard) */
      let nb = addDays(base, len);
      if(nb <= todayISO()) nb = addDays(todayISO(), 1);
      if(d >= nb) jour = (daysBetween(nb, d) % len) + 1;
    }else{
      if(jour > len){ retard = true; }
      if(jour > len+12){ jour = ((jour-1)%len)+1; retard=false; }
    }
  }else{
    const diff = daysBetween(h[0],d);
    jour = ((diff%len)+len)%len+1;
  }
  const phase = phaseFor(Math.min(jour,len), len);
  const prochaines = base ? addDays(base, len) : addDays(h[0], len);
  return {jour, len, phase, retard, base, prochaines, ov: ovDay(len)};
}
function toneOf(ph){ return PHASE_TONE[ph.id] || "violet"; }

/* Bouton « 1er jour de règles » pour le jour sélectionné ; un jour futur affiche la prévision à la place. */
function periodBtn(day){
  if(day > todayISO()){
    const c = cycleInfo(day);
    const prev = c && c.jour===1 ? `Règles prévues ce jour-là (estimation). ` : c && c.phase.id==="menstruelle" ? `Pendant tes règles prévues (J${c.jour}). ` : "";
    return `<div class="callout tiny" style="margin-top:10px">${prev}Jour à venir : tu pourras noter tes règles le jour où elles commencent, en un clic depuis l'accueil ou l'onglet Cycle.</div>`;
  }
  const on = starts().includes(day);
  return `<button class="btn sm block" data-period="${day}" style="margin-top:10px">
        ${on?`✓ Règles le ${fmtShort(day)} — annuler`:`Marquer le ${fmtShort(day)} comme 1er jour de règles`}
      </button>`;
}
/* Ajoute ou retire une date de début de règles, quelle que soit la date. */
function togglePeriod(day){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day) || isNaN(D(day))) return toast("Date invalide");
  if(day > todayISO()) return toast("Cette date est dans le futur");
  const h = S.cycle.historique, i = h.indexOf(day);
  if(i>=0){
    h.splice(i,1); save(); render();
    return toast("Date du "+fmtShort(day)+" retirée");
  }
  h.push(day); h.sort(); save(); render();
  const ci = cycleInfo();
  toast(ci ? `Enregistré · tu es à J${ci.jour} aujourd'hui` : "Date enregistrée");
}

const plan = id => PROGRAMS.find(p=>p.id===id) || PROGRAMS[0];
function nextSessionIdx(){
  const p = plan(S.planActif);
  const done = S.seances.filter(s=>s.planId===p.id);
  if(!done.length) return 0;
  return (done[done.length-1].sessionIdx+1) % p.sessions.length;
}
/* toutes les dates de séances : détaillées (journal) + rapides (« +1 ») */
function datesSeances(){ return [...S.seances.map(x=>x.date), ...S.rapides].sort(); }
const lundiDe = d => addDays(d, -((D(d).getDay()+6)%7));
function seancesSemaine(){
  const lundi = lundiDe(todayISO());
  return datesSeances().filter(d=>d>=lundi).length;
}
function lastPerf(exId){
  for(let i=S.seances.length-1;i>=0;i--){
    const e=S.seances[i].exos.find(x=>x.exId===exId);
    if(e && e.sets.some(st=>st.kg||st.reps)) return {date:S.seances[i].date, sets:e.sets.filter(st=>st.kg||st.reps)};
  }
  return null;
}
const poidsActuel = () => S.poids.length ? S.poids[S.poids.length-1].kg : S.profil.poidsDepart;
/* Moyenne des pesées des 7 derniers jours : le seul chiffre à suivre, la pesée du jour varie trop (eau, cycle). */
function moyenne7(){
  if(!S.poids.length) return null;
  const last = S.poids[S.poids.length-1].date, from = addDays(last,-6);
  const w = S.poids.filter(p=>p.date>=from);
  if(w.length<2) return null;
  return {avg: w.reduce((a,p)=>a+p.kg,0)/w.length, n: w.length};
}

const PALIERS = [1,5,10,15,20,25,30,40,50,60,75,100,125,150,200,250,300,365,400,500];

function totalSeances(){ return (+S.profil.seancesAvant||0) + S.seances.length + S.rapides.length; }
function paliers(){
  const t = totalSeances();
  const prev = [...PALIERS].reverse().find(p=>p<=t) || 0;
  const next = PALIERS.find(p=>p>t) || (Math.floor(t/100)+1)*100;
  return {t, prev, next};
}
/* semaines d'affilée (lundi → dimanche) avec au moins 2 séances ; la semaine en cours ne casse pas la série */
function serieSemaines(){
  const par = {};
  datesSeances().forEach(d=>{ const l=lundiDe(d); par[l]=(par[l]||0)+1; });
  let l = lundiDe(todayISO()), n = 0;
  if((par[l]||0) >= 2) n++;
  l = addDays(l,-7);
  while((par[l]||0) >= 2){ n++; l = addDays(l,-7); }
  return n;
}

  const d = D(todayISO()), j = Math.floor((d - new Date(d.getFullYear(),0,0))/86400000);

}

function celebrate(phaseId, rapide){
  const {t, next} = paliers(), serie = serieSemaines(), sem = seancesSemaine();
  const badge = PALIERS.includes(t);
  const msg = BRAVO[t % BRAVO.length];
  const dots = Array.from({length:4},(_,i)=>`<i class="${i<sem?"on":""}"></i>`).join("");
  const cols = ["var(--pink)","var(--violet)","var(--orange)","var(--mint)","var(--blue)"];
  const conf = Array.from({length:36},(_,i)=>`<span style="left:${(i*97)%100}%;background:${cols[i%5]};animation-delay:${(i%9)*.08}s;animation-duration:${1.6+(i%5)*.25}s;transform:rotate(${i*37}deg)"></span>`).join("");
  const semTxt = sem>=4 ? `Objectif de la semaine atteint : ${sem} séances !` : `${sem} séance${sem>1?"s":""} sur 4 cette semaine. ${sem===3?"Plus qu'une !":""}`;
  $("#modalEyebrow").textContent = rapide ? "Séance ajoutée" : "Séance enregistrée";
  $("#modalTitle").textContent = msg;
  $("#modalBody").innerHTML = `
    <div class="confetti" aria-hidden="true">${conf}</div>
    <div class="cel">
      <div class="cel-num"><small>Séance n°</small>${t}</div>
      ${badge?`<div class="cel-badge">🏅 Nouveau badge débloqué : <strong>${esc(BADGE_NOM[t]||t+" séances")}</strong></div>`:
        `<div class="tiny muted">Encore ${next-t} avant le badge ${next}.</div>`}
      <div class="cel-dots">${dots}</div>
      <p class="small" style="margin-top:4px">${semTxt}</p>
      ${serie>=2?`<p class="small"><strong>${serie} semaines d'affilée</strong> avec au moins 2 séances. Continue comme ça.</p>`:""}
      ${phaseId && BRAVO_PHASE[phaseId]?`<p class="callout small" style="margin-top:10px;text-align:left">${esc(BRAVO_PHASE[phaseId])}</p>`:""}
      <p class="mv-quote">« ${esc(citationDuJour())} »</p>
      <button class="btn dark block" id="celebrateOk" style="margin-top:12px">Merci !</button>
    </div>`;
  $("#overlay").hidden = false;
  try{ navigator.vibrate && navigator.vibrate([60,40,60,40,120]); }catch(e){}
}

/* Composition corporelle (balance à impédance de la salle) : % de graisse et masse musculaire.
   C'est l'évolution de ces deux chiffres qui dit si la perte vient bien du gras. */
function compoCard(){
  const c = S.compo, first = c[0], last = c[c.length-1];
  const sign = (x,d=1) => (x>0?"+":x<0?"−":"±")+Math.abs(x).toFixed(d);
  const bilan = c.length>1 ? `<div class="callout small" style="margin-top:12px">
      Depuis le ${fmtShort(first.date)} : <strong class="mono">${sign(last.tgc-first.tgc)} pt</strong> de graisse ·
      <strong class="mono">${sign(last.mm-first.mm)} kg</strong> de muscle.
      ${last.tgc<first.tgc && last.mm>=first.mm-0.5 ? " Tu perds du gras sans perdre de muscle : c'est exactement l'objectif." : ""}
    </div>` : "";
  return `<div class="glass pad">
    <div class="eyebrow">Composition corporelle</div>
    <p class="tiny muted" style="margin-top:6px">Relevé de la balance de ta salle. Refais-le toutes les 3-4 semaines, dans les mêmes conditions (matin, à jeun, même phase du cycle si possible).</p>
    ${c.length?`<div class="tablewrap" style="margin-top:10px"><table><tbody>
      <tr><td class="tiny muted">Date</td><td class="tiny muted">% graisse</td><td class="tiny muted">Muscle</td><td></td></tr>
      ${c.map((x,i)=>`<tr><td>${fmtShort(x.date)}</td><td class="num">${x.tgc.toFixed(1)} %</td><td class="num">${x.mm.toFixed(1)} kg</td>
        <td style="text-align:right"><button class="x tiny muted" data-delcompo="${i}" aria-label="Supprimer">✕</button></td></tr>`).join("")}
    </tbody></table></div>`:""}
    ${bilan}
    <label class="field" style="margin-top:12px">Date du relevé<input type="date" id="cDate" value="${todayISO()}" max="${todayISO()}"></label>
    <div class="row" style="gap:8px;margin-top:8px;flex-wrap:nowrap">
      <label class="field" style="flex:1;min-width:0">% de graisse (TGC)<input type="number" step="0.1" inputmode="decimal" id="cTgc" placeholder="37.9"></label>
      <label class="field" style="flex:1;min-width:0">Masse musculaire (kg)<input type="number" step="0.1" inputmode="decimal" id="cMm" placeholder="42.0"></label>
    </div>
    <button class="btn sm block" id="addCompo" style="margin-top:8px">Enregistrer le relevé</button>
  </div>`;
}

function sparkline(data){
  const pts = data.slice(-30), W=600, H=110, pad=10;
  const vals = pts.map(p=>p.kg);
  const min = Math.min(...vals, S.profil.poidsCible)-.5, max = Math.max(...vals)+.5;
  const x = i => pad + i*(W-2*pad)/Math.max(1,pts.length-1);
  const y = v => pad + (max-v)*(H-2*pad)/Math.max(.1,max-min);
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(" ");
  const area = line+` L${x(pts.length-1).toFixed(1)},${H-pad} L${x(0).toFixed(1)},${H-pad} Z`;
  const c = y(S.profil.poidsCible);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Courbe de poids">
    <defs><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--violet)" stop-opacity=".35"/><stop offset="100%" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>
    ${c>0&&c<H?`<line x1="0" y1="${c.toFixed(1)}" x2="${W}" y2="${c.toFixed(1)}" stroke="var(--mint)" stroke-dasharray="5 5" stroke-width="1.5"/>`:""}
    <path d="${area}" fill="url(#gw)"/>
    <path d="${line}" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(pts[pts.length-1].kg).toFixed(1)}" r="5" fill="var(--violet)"/>
  </svg>
  <div class="row tiny muted" style="justify-content:space-between">
    <span>${fmtShort(pts[0].date)}</span><span class="mono">cible ${S.profil.poidsCible} kg</span><span>${fmtShort(pts[pts.length-1].date)}</span></div>`;
}

/* ===================== événements ===================== */
document.addEventListener("click", ev=>{
  const t = ev.target.closest("button");
  if(!t) return;
  const d = t.dataset;

  if(d.tab) return go(d.tab);
  if(d.goto) return go(d.goto);
  if(d.ex) return openExercise(d.ex);
  if(d.open){ openProgram = d.open; return render(); }
  if(d.back){ openProgram = null; return render(); }
  if(d.activate){ S.planActif = d.activate; save(); toast("Plan actif mis à jour"); return render(); }
  if(d.day){ selDay = d.day; return render(); }
  if(d.cal){ calRef = iso(new Date(D(calRef).getFullYear(), D(calRef).getMonth()+(+d.cal), 1)); return viewCycle(); }
  if(d.period) return togglePeriod(d.period);
  if(d.delperiod){
    const i = S.cycle.historique.indexOf(d.delperiod);
    if(i>=0 && confirm("Supprimer les règles du "+fmtShort(d.delperiod)+" ?")){ S.cycle.historique.splice(i,1); save(); toast("Date supprimée"); render(); }
    return;
  }
  if(d.energy){
    const j = S.cycle.jours[selDay] || (S.cycle.jours[selDay]={});
    j.e = (j.e==+d.energy) ? null : +d.energy;
    save(); return render();
  }
  if(d.start !== undefined && t.hasAttribute("data-start")){
    if(S.draft) return go("journal");
    return startSession(S.planActif, +d.start);
  }
  if(d.startProg){
    if(S.draft && !confirm("Une séance est déjà en cours. La remplacer ?")) return;
    return startSession(d.startProg, +d.startIdx);
  }
  if(d.g){ fGroupe = d.g; return render(); }
  if(d.m){ fMat = d.m; return render(); }
  if(d.addset){ S.draft.exos[+d.addset].sets.push({kg:"",reps:""}); save(); return render(); }
  if(d.delset){
    const [i,j] = d.delset.split("-").map(Number);
    if(S.draft.exos[i].sets.length>1) S.draft.exos[i].sets.splice(j,1);
    save(); return render();
  }
  if(d.rest) return startRest(+d.rest);
  if(d.delcompo !== undefined && t.hasAttribute("data-delcompo")){
    if(confirm("Supprimer ce relevé ?")){ S.compo.splice(+d.delcompo,1); save(); render(); }
    return;
  }
  if(d.delseance){
    if(confirm("Supprimer cette séance du journal ?")){ S.seances.splice(+d.delseance,1); save(); render(); }
    return;
  }

  switch(t.id){
    case "addCompo": {
      const date = $("#cDate").value, tgc = parseFloat($("#cTgc").value), mm = parseFloat($("#cMm").value);
      if(!date || date > todayISO()) return toast("Choisis une date valide");
      if(!(tgc>=5 && tgc<=60)) return toast("% de graisse entre 5 et 60");
      if(!(mm>=15 && mm<=80)) return toast("Masse musculaire en kg (15 à 80)");
      const ex = S.compo.find(x=>x.date===date);
      if(ex){ ex.tgc = tgc; ex.mm = mm; } else S.compo.push({date, tgc, mm});
      S.compo.sort((a,b)=>a.date.localeCompare(b.date));
      save(); toast("Relevé enregistré"); render();
      break;
    }
    case "restStop": stopRest(); break;
    case "quickSession": {
      S.rapides.push(todayISO()); S.rapides.sort(); save(); render();
      celebrate((cycleInfo()||{phase:{}}).phase.id, true);
      break;
    }
    case "editCounter": openCounter(); break;
    case "saveCounter": {
      const x = parseInt($("#counterVal").value);
      const base = S.seances.length;
      if(isNaN(x) || x<0 || x>5000) return toast("Entre un nombre valide");
      if(x<base) return toast(`Tu as déjà ${base} séance${base>1?"s":""} détaillée${base>1?"s":""} dans le journal`);
      let extra = x-base;
      if(extra < S.rapides.length){ S.rapides = extra ? S.rapides.slice(-extra) : []; S.profil.seancesAvant = 0; }
      else S.profil.seancesAvant = extra - S.rapides.length;
      save(); $("#overlay").hidden = true; render(); toast(`Compteur mis à jour : ${x} séance${x>1?"s":""}`);
      break;
    }
    case "celebrateOk": $("#overlay").hidden = true; break;
    case "addPeriod": {
      const inp = $("#periodDate");
      if(!inp || !inp.value) return toast("Choisis une date");
      if(S.cycle.historique.includes(inp.value)) return toast("Cette date est déjà enregistrée");
      togglePeriod(inp.value);
      break;
    }
    case "modalClose": $("#overlay").hidden = true; break;
    case "themeBtn":
      S.theme = S.theme==="auto" ? "light" : S.theme==="light" ? "dark" : "auto";
      applyTheme(); save(); toast("Thème : "+({auto:"système",light:"clair",dark:"sombre"}[S.theme]));
      break;
    case "quickWeightBtn": {
      const input = t.closest(".row,.between,.glass").querySelector(".js-weight") || document.querySelector(".view.active .js-weight");
      const val = parseFloat(input && input.value);
      if(!val || val<30 || val>250) return toast("Entre un poids valide");
      const day = todayISO(), ex = S.poids.find(p=>p.date===day);
      if(ex) ex.kg = val; else S.poids.push({date:day, kg:val});
      S.poids.sort((a,b)=>a.date.localeCompare(b.date));
      save(); toast("Pesée enregistrée"); render();
      break;
    }
    case "cancelDraft":
      if(confirm("Abandonner cette séance sans l'enregistrer ?")){ S.draft=null; save(); render(); }
      break;
    case "saveSession": {
      const dr = S.draft;
      dr.duree = $("#dDuree").value; dr.ressenti = $("#dRessenti").value; dr.notes = $("#dNotes").value;
      if(!dr.exos.some(x=>x.sets.some(st=>st.kg||st.reps))) return toast("Renseigne au moins une série");
      const ci = cycleInfo();
      S.seances.push({date:dr.date, planId:dr.planId, sessionIdx:dr.sessionIdx, nom:dr.nom,
        duree:dr.duree, ressenti:dr.ressenti, notes:dr.notes, phase: ci?ci.phase.nom:"", exos:dr.exos});
      S.draft = null; save(); render(); celebrate(ci?ci.phase.id:null);
      break;
    }
    case "exportBtn": exportData(); break;
    case "importBtn": importData(); break;
    case "resetBtn":
      if(confirm("Effacer toutes tes données ? C'est irréversible.")){ S = structuredClone(DEFAULT_STATE); save(); render(); toast("Données effacées"); }
      break;
  }
});

document.addEventListener("input", ev=>{
  const t = ev.target;
  if(t.id==="exSearch"){
    fQ = t.value; const p = t.selectionStart; viewExos();
    const n = $("#exSearch"); if(n){ n.focus(); n.setSelectionRange(p,p); }
    return;
  }
  if(t.id==="dayNote"){
    const j = S.cycle.jours[selDay] || (S.cycle.jours[selDay]={});
    j.n = t.value; save(); return;
  }
  if(t.dataset.set && S.draft){
    const [i,j,k] = t.dataset.set.split("-");
    S.draft.exos[+i].sets[+j][k] = t.value; save(); return;
  }
  if(["dDuree","dNotes","dRessenti"].includes(t.id) && S.draft){
    S.draft[{dDuree:"duree",dNotes:"notes",dRessenti:"ressenti"}[t.id]] = t.value; save(); return;
  }
  if(t.id==="cLen" || t.id==="cReg"){
    if(t.id==="cLen") S.cycle.duree = Math.max(21,Math.min(40,+t.value||28));
    else S.cycle.regles = Math.max(2,Math.min(8,+t.value||5));
    save();
    clearTimeout(window._cyc); window._cyc = setTimeout(()=>{ if(current==="cycle") viewCycle(); }, 800);
  }
});

$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") $("#overlay").hidden = true; });

/* ===================== sauvegarde externe ===================== */
async function exportData(){
  const json = JSON.stringify(S,null,2), name = `cycle-charge-${todayISO()}.json`;
  try{
    const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:name, data:json}); toast("Sauvegarde téléchargée"); return; }
  }catch(e){}
  try{ await navigator.clipboard.writeText(json); toast("Sauvegarde copiée"); }
  catch(e){ window.prompt("Copie ce texte et garde-le :", json); }
}
function importData(){
  const json = window.prompt("Colle ici ta sauvegarde :");
  if(!json) return;
  try{
    const p = JSON.parse(json);
    if(!p || typeof p!=="object") throw new Error();
    localStorage.setItem(KEY, JSON.stringify(p));
    S = load(); save(); render(); toast("Sauvegarde restaurée");
  }catch(e){ toast("Ce texte n'est pas une sauvegarde valide"); }
}

/* ===================== minuteur de repos ===================== */
function restSec(txt){
  const m = String(txt||"").match(/(\d+)\s*(min|s)\b/);
  if(!m) return 0;
  return m[2]==="min" ? +m[1]*60 : +m[1];
}
const fmtRest = n => n>=60 ? `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}` : `${n} s`;
let restEnd = 0, restTotal = 0, restTick = null;
function startRest(sec){
  if(!sec) return;
  restTotal = sec; restEnd = Date.now() + sec*1000;
  let el = $("#restTimer");
  if(!el){
    el = document.createElement("div"); el.id = "restTimer"; el.className = "resttimer"; el.setAttribute("role","timer");
    el.innerHTML = `<div class="rt-bar"><i></i></div><span class="rt-label">Repos</span><strong class="rt-time mono"></strong><button id="restStop" aria-label="Arrêter le minuteur">✕</button>`;
    document.body.appendChild(el);
  }
  el.hidden = false;
  clearInterval(restTick); restTick = setInterval(updateRest, 250); updateRest();
}
function updateRest(){
  const el = $("#restTimer"); if(!el) return;
  const left = Math.max(0, Math.ceil((restEnd-Date.now())/1000));
  el.querySelector(".rt-time").textContent = fmtRest(left).replace(" s","s");
  el.querySelector(".rt-bar i").style.width = (100*left/restTotal)+"%";
  if(left<=0){
    stopRest();
    try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
    try{
      const a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.35);
    }catch(e){}
    toast("Repos terminé : série suivante !");
  }
}
function stopRest(){
  clearInterval(restTick); restTick = null;
  const el = $("#restTimer"); if(el) el.hidden = true;
}

/* ===================== thème ===================== */
function applyTheme(){
  const r = document.documentElement;
  if(S.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
}

/* ===================== démarrage ===================== */
applyTheme();
save();          /* fige la migration éventuelle depuis l'ancienne version */
renderNav();
go("home");

/* ============================================================
   Compléments de la version autonome (hébergée sur Netlify) :
   téléchargement de fichier réel, import par fichier,
   service worker hors ligne et invite d'installation.
   ============================================================ */

/* ---------- export : vrai téléchargement de fichier ---------- */
exportData = async function(){
  const json = JSON.stringify(S, null, 2);
  const name = `cycle-charge-${todayISO()}.json`;
  try{
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast("Sauvegarde téléchargée");
    return;
  }catch(e){}
  try{ await navigator.clipboard.writeText(json); toast("Sauvegarde copiée"); }
  catch(e){ window.prompt("Copie ce texte et garde-le :", json); }
};

/* ---------- import : depuis un fichier .json ---------- */
const fileInput = document.createElement("input");
fileInput.type = "file";
fileInput.accept = "application/json,.json";
fileInput.hidden = true;
document.body.appendChild(fileInput);

fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const p = JSON.parse(reader.result);
      if(!p || typeof p !== "object") throw new Error();
      localStorage.setItem(KEY, JSON.stringify(p));
      S = load(); save(); render();
      toast("Sauvegarde restaurée");
    }catch(e){ toast("Ce fichier n'est pas une sauvegarde valide"); }
    fileInput.value = "";
  };
  reader.readAsText(f);
});

importData = function(){ fileInput.click(); };

/* ---------- installation sur l'écran d'accueil ---------- */
let installEvent = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installEvent = e;
  if(localStorage.getItem("cc_install_dismissed")) return;
  const bar = document.createElement("div");
  bar.className = "install-bar glass";
  bar.innerHTML = `<span>Installer l'app sur ton écran d'accueil ?</span>
    <button class="btn dark sm" id="doInstall">Installer</button>
    <button class="btn ghost sm" id="noInstall" aria-label="Plus tard">✕</button>`;
  document.body.appendChild(bar);
  bar.addEventListener("click", async ev => {
    const b = ev.target.closest("button"); if(!b) return;
    if(b.id === "doInstall" && installEvent){ installEvent.prompt(); await installEvent.userChoice; }
    else if(b.id === "noInstall"){ localStorage.setItem("cc_install_dismissed","1"); }
    bar.remove();
  });
});

/* ---------- service worker : fonctionne hors ligne ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
